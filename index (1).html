<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Provider Baseball Cards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f0f2f5;min-height:100vh;padding:20px;}
.wrap{max-width:700px;margin:0 auto;}
.dir-header{background:#1a3a5c;color:#fff;border-radius:12px 12px 0 0;padding:16px 20px;}
.dir-header h1{font-size:18px;font-weight:500;margin:0;color:#fff;}
.dir-header p{font-size:12px;opacity:0.65;margin:3px 0 0;}
.dir-list{border:1px solid #dde3ed;border-top:none;border-radius:0 0 12px 12px;overflow:hidden;background:#fff;}
.dir-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #eef0f4;cursor:pointer;background:#fff;transition:background 0.12s;}
.dir-item:last-child{border-bottom:none;}
.dir-item:hover{background:#f5f8ff;}
.d-av{width:38px;height:38px;border-radius:50%;background:#1a3a5c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px;flex-shrink:0;}
.d-info{flex:1;min-width:0;}
.d-name{font-size:13px;font-weight:600;color:#1a3a5c;}
.d-sub{font-size:11px;color:#7a8599;margin-top:2px;}
.d-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;flex-shrink:0;}
.card-wrap{display:none;}
.back{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:#1a3a5c;cursor:pointer;margin-bottom:10px;padding:4px 0;}
.back:hover{opacity:0.7;}
.card{border:1px solid #dde3ed;border-radius:12px;overflow:hidden;background:#fff;}
.c-head{background:#1a3a5c;color:#fff;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;}
.pname{font-size:14px;font-weight:500;}
.pnum{font-size:10px;opacity:0.6;}
.c-top{display:grid;grid-template-columns:140px 1fr;border-bottom:1px solid #eef0f4;}
.photo-col{border-right:1px solid #eef0f4;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 10px;gap:5px;background:#f8f9fb;}
.dm-label{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:0.7px;color:#bf8c00;background:#faeeda;border:0.5px solid #ef9f27;border-radius:20px;padding:2px 8px;}
.av{width:60px;height:60px;border-radius:50%;background:#1a3a5c;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500;color:#fff;}
.spec-badge{background:#1a3a5c;color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;text-align:center;}
.info-col{padding:12px 14px;}
.slabel{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.7px;color:#7a8599;margin:8px 0 4px;}
.slabel:first-child{margin-top:0;}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.sbox{background:#f8f9fb;border-radius:8px;padding:5px 8px;}
.sbox .sl{font-size:9px;color:#7a8599;}
.sbox .sv{font-size:12px;font-weight:500;color:#1a1f2e;}
.c-mid{border-bottom:1px solid #eef0f4;padding:12px 14px;}
.tcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tag-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.itag{font-size:10px;padding:2px 7px;border-radius:20px;background:#eaf3de;color:#3b6d11;border:0.5px solid #97c459;display:inline-flex;align-items:center;gap:3px;}
.htag{font-size:10px;padding:2px 7px;border-radius:20px;background:#f0f2f5;color:#4a5568;border:0.5px solid #dde3ed;display:inline-flex;align-items:center;gap:3px;}
.atag{font-size:10px;padding:2px 7px;border-radius:20px;border:0.5px solid #dde3ed;cursor:pointer;display:inline-flex;align-items:center;gap:3px;}
.atag.on{background:#eaf3de;color:#3b6d11;border-color:#97c459;}
.atag.off{background:#fcebeb;color:#a32d2d;border-color:#f09595;}
.atag.neu{background:#f0f2f5;color:#4a5568;}
.rtm-row{display:flex;align-items:center;gap:7px;margin-top:5px;}
.rtm-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.rtm-sel{font-size:11px;padding:3px 7px;border-radius:8px;border:1px solid #dde3ed;background:#f8f9fb;color:#1a1f2e;cursor:pointer;}
.c-bot{padding:12px 14px;}
.notes{width:100%;box-sizing:border-box;background:#f8f9fb;border-radius:8px;padding:8px 10px;font-size:11px;color:#1a1f2e;min-height:80px;border:1px dashed #c8d0df;resize:vertical;font-family:inherit;line-height:1.6;}
.notes:focus{outline:none;border-color:#378add;}
.c-foot{background:#1a3a5c;color:rgba(255,255,255,0.55);font-size:10px;padding:5px 14px;display:flex;justify-content:space-between;}
.add-row{display:flex;align-items:center;gap:5px;margin-top:6px;}
.add-input{font-size:10px;padding:3px 8px;border-radius:20px;border:1px dashed #c8d0df;background:#f8f9fb;color:#1a1f2e;width:120px;font-family:inherit;}
.add-input:focus{outline:none;border-color:#378add;}
.add-btn{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid #dde3ed;background:transparent;color:#4a5568;cursor:pointer;}
.add-btn:hover{background:#f0f2f5;}
[contenteditable]{cursor:text;border-radius:3px;padding:0 2px;}
[contenteditable]:hover{background:rgba(55,138,221,0.07);}
[contenteditable]:focus{outline:none;background:rgba(55,138,221,0.1);box-shadow:0 0 0 1.5px #378add;}
.del-btn{border:none;background:none;cursor:pointer;opacity:0.4;font-size:12px;padding:0;margin-left:2px;color:inherit;line-height:1;}
.del-btn:hover{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <div id="dir">
    <div class="dir-header">
      <h1>&#9918; Provider Baseball Cards</h1>
      <p>Click any provider to open their card</p>
    </div>
    <div class="dir-list" id="dlist"></div>
  </div>
  <div class="card-wrap" id="cv">
    <div class="back" id="backbtn">&#8592; Back to all providers</div>
    <div class="card" id="cc"></div>
  </div>
</div>
<script>
var P=[
  {id:"indy-south",num:"#001",practice:"Indy South Foot & Ankle",initials:"JS",doctor:"Dr. Jeff Stevens",cred:"DPM",spec:"Podiatry",type:"Group",count:"2 DPMs",phone:"317-300-0106",surg:"Yes",addr:"7855 S. Emerson Ave, Suite T, Indianapolis IN 46237",web:"indysouthfootandankle.com",ins:["Medicare","Aetna","Anthem/BC","Cigna","Humana","United"],hosp:["Community Hospital South","Franciscan Surgery Ctr","St. Francis Hospital"],attrs:[{t:"Board certified — foot & ankle surgery",s:"on"},{t:"Board certified — podiatry",s:"on"},{t:"Laser treatment",s:"on"},{t:"EPAT therapy",s:"on"},{t:"Custom orthotics",s:"on"}],rtm:"unknown",notes:"Graduated Ohio College of Podiatric Medicine 1988. Also see Dr. Mark Runkle DPM. Accepts most commercial plans + workers comp.",status:"Follow-Up",sc:"#F5A623"},
  {id:"nova-foot",num:"#002",practice:"NoVa Foot and Ankle",initials:"NF",doctor:"Dr. [See providers page]",cred:"DPM",spec:"Podiatry",type:"Group",count:"Multiple",phone:"(703) 437-5353",surg:"Yes",addr:"Herndon VA & Springfield VA",web:"novafootandankle.com",ins:["Medicare","Medicaid","BCBS","Aetna","Cigna","United"],hosp:["Inova Fairfax","Reston Hospital","Virginia Hospital Ctr"],attrs:[{t:"Diabetic foot care",s:"on"},{t:"Sports injuries",s:"on"},{t:"Bunion/hammertoe surgery",s:"on"},{t:"Custom orthotics",s:"on"}],rtm:"unknown",notes:"Two locations — Herndon (703) 437-5353 and Springfield (703) 642-5340. Accepting new patients. Active on social @novafootdoc.",status:"Cold",sc:"#95A5A6"},
  {id:"dd-pod",num:"#003",practice:"DD Podiatry",initials:"NT",doctor:"Dr. Nam Tran",cred:"DPM",spec:"Concierge Podiatry",type:"Concierge / Private",count:"2 DPMs",phone:"(301) 363-2676",surg:"Minimally invasive",addr:"Bethesda MD & McLean VA",web:"ddpodiatry.com",ins:["Private pay","Select PPO","Verify at booking"],hosp:["Sibley Memorial","Georgetown University Hospital"],attrs:[{t:"Regenerative medicine",s:"on"},{t:"Shockwave therapy",s:"on"},{t:"Biologic injections",s:"on"},{t:"Minimally invasive surgery",s:"on"},{t:"60-min visits",s:"on"}],rtm:"unknown",notes:"Also Dr. Miriam Niktash DPM. 60-min visits, same/next-day appts. High-income patient base. RTM fits their premium monitoring model perfectly.",status:"Cold",sc:"#95A5A6"},
  {id:"maple",num:"#004",practice:"Maple Springs Foot Center",initials:"SS",doctor:"Dr. Stuart R. Snyder",cred:"DPM, FACFAS",spec:"Podiatry / Foot Surgery",type:"Group",count:"3 DPMs",phone:"(301) 762-3338",surg:"Yes",addr:"Rockville / Silver Spring MD area",web:"drstuartsnyder.com",ins:["Medicare","Medicaid","BCBS","Aetna","Cigna","United"],hosp:["Holy Cross Hospital","Adventist HealthCare Shady Grove"],attrs:[{t:"Board certified — foot surgery (ABPS)",s:"on"},{t:"Diabetic foot & wound care",s:"on"},{t:"Laser toenail fungus",s:"on"},{t:"Vascular testing (PAD)",s:"on"},{t:"Habla Espanol",s:"on"}],rtm:"unknown",notes:"Also Dr. Sara Sharma and Dr. Gregory Aubertin. Strong diabetic foot care program — great RTM angle. Spanish-speaking staff.",status:"Cold",sc:"#95A5A6"},
  {id:"blanken",num:"#005",practice:"Blanken Foot and Ankle",initials:"SB",doctor:"Dr. Steven Blanken",cred:"DPM",spec:"Podiatry / Foot & Ankle Surgery",type:"Group",count:"2 DPMs",phone:"(301) 592-0505",surg:"Yes",addr:"Silver Spring MD",web:"silverspringblankenpodiatry.com",ins:["Medicare","Medicaid","BCBS","Aetna","Cigna","United"],hosp:["Holy Cross Hospital","Washington Adventist Hospital"],attrs:[{t:"Foot & ankle surgery",s:"on"},{t:"Amniotic stem cell therapy",s:"on"},{t:"Custom orthotics",s:"on"},{t:"Sports medicine",s:"on"},{t:"Diabetic foot care",s:"on"}],rtm:"unknown",notes:"Also Dr. Cassandre Charles DPM. Local to Silver Spring. Amniotic stem cell therapy. Good RTM angle for post-op monitoring.",status:"Cold",sc:"#95A5A6"},
];
var RTM=[
  {v:"unknown",l:"Unknown - needs outreach",c:"#ef9f27"},
  {v:"yes",l:"Yes - familiar with RTM",c:"#639922"},
  {v:"no",l:"No - not familiar",c:"#e24b4a"},
  {v:"interested",l:"Interested - wants more info",c:"#378add"},
];
function buildDir(){
  var dl=document.getElementById('dlist');
  dl.innerHTML='';
  P.forEach(function(p){
    var d=document.createElement('div');
    d.className='dir-item';
    d.innerHTML='<div class="d-av">'+p.initials+'</div><div class="d-info"><div class="d-name">'+p.practice+'</div><div class="d-sub">'+p.doctor+' &middot; '+p.phone+'</div></div><span class="d-badge" style="background:'+p.sc+'22;color:'+p.sc+';border:0.5px solid '+p.sc+'">'+p.status+'</span> &#8250;';
    d.onclick=function(){showCard(p.id);};
    dl.appendChild(d);
  });
}
function showCard(id){
  var p=null;
  for(var i=0;i<P.length;i++){if(P[i].id===id){p=P[i];break;}}
  if(!p)return;
  document.getElementById('dir').style.display='none';
  document.getElementById('cv').style.display='block';
  var rtmObj=RTM[0];
  for(var i=0;i<RTM.length;i++){if(RTM[i].v===p.rtm){rtmObj=RTM[i];break;}}
  var rtmOpts='';
  RTM.forEach(function(o){rtmOpts+='<option value="'+o.v+'"'+(p.rtm===o.v?' selected':'')+'>'+o.l+'</option>';});
  document.getElementById('cc').innerHTML=
    '<div class="c-head"><span class="pname" contenteditable="true">'+p.practice+'</span><span class="pnum">PROVIDER CARD '+p.num+'</span></div>'+
    '<div class="c-top">'+
      '<div class="photo-col">'+
        '<div class="dm-label">Decision maker</div>'+
        '<div class="av" contenteditable="true">'+p.initials+'</div>'+
        '<div style="font-size:13px;font-weight:600;text-align:center;color:#1a1f2e" contenteditable="true">'+p.doctor+'</div>'+
        '<div style="font-size:11px;color:#7a8599;text-align:center" contenteditable="true">'+p.cred+'</div>'+
        '<div class="spec-badge" contenteditable="true">'+p.spec+'</div>'+
      '</div>'+
      '<div class="info-col">'+
        '<div class="slabel">Practice info</div>'+
        '<div class="sgrid">'+
          '<div class="sbox"><div class="sl">Practice type</div><div class="sv" contenteditable="true">'+p.type+'</div></div>'+
          '<div class="sbox"><div class="sl">Providers</div><div class="sv" contenteditable="true">'+p.count+'</div></div>'+
          '<div class="sbox"><div class="sl">Phone</div><div class="sv" contenteditable="true">'+p.phone+'</div></div>'+
          '<div class="sbox"><div class="sl">Surgery</div><div class="sv" contenteditable="true">'+p.surg+'</div></div>'+
        '</div>'+
        '<div class="slabel">Location</div>'+
        '<div style="font-size:11px;color:#7a8599" contenteditable="true">'+p.addr+'</div>'+
        '<div class="slabel">Website</div>'+
        '<div style="font-size:11px;color:#378add" contenteditable="true">'+p.web+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="c-mid">'+
      '<div class="tcols">'+
        '<div><div class="slabel">Insurance accepted</div><div class="tag-row" id="ins-tags"></div><div class="add-row"><input class="add-input" id="ni" placeholder="Add insurance..."/><button class="add-btn" onclick="addIns()">+ Add</button></div></div>'+
        '<div><div class="slabel">Hospital affiliations</div><div class="tag-row" id="hosp-tags"></div><div class="add-row"><input class="add-input" id="nh" placeholder="Add hospital..."/><button class="add-btn" onclick="addHosp()">+ Add</button></div></div>'+
      '</div>'+
      '<div style="margin-top:12px"><div class="slabel">Key attributes</div><div class="tag-row" id="attr-tags"></div><div class="add-row"><input class="add-input" id="na" placeholder="Add attribute..."/><button class="add-btn" onclick="addAttr()">+ Add</button></div></div>'+
      '<div style="margin-top:12px"><div class="slabel">RTM awareness</div><div class="rtm-row"><div class="rtm-dot" id="rtm-dot" style="background:'+rtmObj.c+'"></div><select class="rtm-sel" id="rtm-sel" onchange="updateRtm()">'+rtmOpts+'</select></div></div>'+
    '</div>'+
    '<div class="c-bot"><div class="slabel">Research notes / follow-up</div><textarea class="notes" placeholder="Add notes...">'+p.notes+'</textarea></div>'+
    '<div class="c-foot"><span contenteditable="true">'+p.web+'</span><span contenteditable="true">Last updated: May 2026</span></div>';
  document.getElementById('ni').addEventListener('keydown',function(e){if(e.key==='Enter')addIns();});
  document.getElementById('nh').addEventListener('keydown',function(e){if(e.key==='Enter')addHosp();});
  document.getElementById('na').addEventListener('keydown',function(e){if(e.key==='Enter')addAttr();});
  p.ins.forEach(function(t){document.getElementById('ins-tags').appendChild(makeTag(t,'itag'));});
  p.hosp.forEach(function(t){document.getElementById('hosp-tags').appendChild(makeTag(t,'htag'));});
  p.attrs.forEach(function(a){document.getElementById('attr-tags').appendChild(makeAttr(a.t,a.s));});
}
function makeTag(text,cls){
  var s=document.createElement('span');s.className=cls;
  var l=document.createElement('span');l.textContent=text;
  var d=document.createElement('button');d.className='del-btn';d.textContent='x';d.onclick=function(){s.remove();};
  s.appendChild(l);s.appendChild(d);return s;
}
function makeAttr(text,state){
  var s=document.createElement('span');s.className='atag '+(state==='on'?'on':state==='off'?'off':'neu');
  var l=document.createElement('span');l.textContent=text;l.style.cursor='pointer';
  l.onclick=function(){if(s.classList.contains('on')){s.classList.remove('on');s.classList.add('off');}else if(s.classList.contains('off')){s.classList.remove('off');s.classList.add('neu');}else{s.classList.remove('neu');s.classList.add('on');}};
  var d=document.createElement('button');d.className='del-btn';d.textContent='x';d.onclick=function(){s.remove();};
  s.appendChild(l);s.appendChild(d);return s;
}
function addIns(){var i=document.getElementById('ni');var v=i.value.trim();if(!v)return;document.getElementById('ins-tags').appendChild(makeTag(v,'itag'));i.value='';}
function addHosp(){var i=document.getElementById('nh');var v=i.value.trim();if(!v)return;document.getElementById('hosp-tags').appendChild(makeTag(v,'htag'));i.value='';}
function addAttr(){var i=document.getElementById('na');var v=i.value.trim();if(!v)return;document.getElementById('attr-tags').appendChild(makeAttr(v,'on'));i.value='';}
function updateRtm(){var v=document.getElementById('rtm-sel').value;for(var i=0;i<RTM.length;i++){if(RTM[i].v===v){document.getElementById('rtm-dot').style.background=RTM[i].c;break;}}}
document.getElementById('backbtn').onclick=function(){document.getElementById('cv').style.display='none';document.getElementById('dir').style.display='block';};
buildDir();
</script>
</body>
</html>
